<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không tìm thấy trang | ACDV-Teams</title>
    <style>
        :root {
            --bg-color: #6a61cf;
            --card-bg: #ffffff;
            --text-dark: #2d3748;
            --text-muted: #718096;
            --accent-purple: #6a61cf;
            --accent-purple-hover: #584ebc;
            --light-purple: #f3f0ff;
            --border-radius: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 440px;
            border-radius: var(--border-radius);
            padding: 40px 28px 32px 28px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .icon-container {
            width: 100px;
            height: 100px;
            background-color: var(--light-purple);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
        }

        .icon-container svg {
            width: 52px;
            height: 52px;
            stroke: var(--accent-purple);
        }

        .error-code {
            font-size: 54px;
            font-weight: 800;
            color: var(--accent-purple);
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .error-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 12px;
        }

        .error-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background-color: var(--accent-purple);
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(106, 97, 207, 0.3);
            border: none;
            cursor: pointer;
        }

        .action-btn:hover {
            background-color: var(--accent-purple-hover);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #edf2f7;
            font-size: 12px;
            color: var(--text-muted);
        }

        .footer p {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Wifi Disconnected / Signal Loss Icon -->
        <div class="icon-container">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h.01"/>
                <path d="M8.5 16.429a5 5 0 0 1 7 0"/>
                <path d="M5 12.857a10 10 0 0 1 5.17-2.69"/>
                <path d="M19 12.857a10 10 0 0 0-2.17-1.44"/>
                <path d="M2 2l20 20"/>
            </svg>
        </div>

        <div class="error-code">404</div>
        <div class="error-title">Mất kết nối tuyến đường!</div>
        <p class="error-desc">
            Trang hoặc đường dẫn bạn đang truy cập không tồn tại hoặc đã bị thay đổi trong hệ thống routing.
        </p>

        <a href="/" class="action-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            Quay lại Trang chủ
        </a>

        <div class="footer">
            <p><strong>ACDV-Teams</strong> Network Routing</p>
            <p>Powered by Python</p>
        </div>
    </div>

</body>
</html>
